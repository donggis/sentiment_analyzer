# Private admin app. Do not deploy until the owner approves the cost.
# The volume named below must be created by the owner; this file does not create it.
app = "sentiment-analyzer-ywuuhq"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  FLASK_ENV = "production"
  PYTHONUNBUFFERED = "1"
  DATABASE_URL = "sqlite:////data/app.db"
  TARGET_CHANNEL_URL = "https://www.youtube.com/@jangpm"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[mounts]
  source = "sentiment_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
